<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kloak - Private Chat</title>
    <meta name="description" content="Privacy-first Discord alternative. No email, no passwords, no tracking." />
    <meta name="author" content="Kloak" />

    <!-- Security headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: blob: https: http:;
      media-src 'self' blob: https:;
      connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.giphy.com https://media.giphy.com https://media0.giphy.com https://media1.giphy.com https://media2.giphy.com https://media3.giphy.com https://media4.giphy.com;
      frame-src 'none';
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      upgrade-insecure-requests;
    " />

    <meta property="og:title" content="Kloak - Private Chat" />
    <meta property="og:description" content="Privacy-first Discord alternative. No email, no passwords, no tracking." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />

    <!-- Stack Sans Headline font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Headline:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Theme initialization script - runs before React to prevent flash -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('kloak-ui');
          if (stored) {
            var parsed = JSON.parse(stored);
            var theme = parsed.state && parsed.state.theme;
            if (theme) {
              document.documentElement.className = theme;
              document.documentElement.setAttribute('data-theme', theme);
            }
          }
        } catch (e) {
          // Fallback to dark theme
          document.documentElement.className = 'dark';
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
