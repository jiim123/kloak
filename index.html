<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Kloak - Private Communication Platform</title>
    <meta
      name="description"
      content="Privacy-first communication platform. No email, no passwords, no tracking. Your conversations belong to you."
    />
    <meta name="author" content="Kloak" />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Preload critical fonts for LCP (hero heading uses General Sans Medium) -->
    <link rel="preload" href="/fonts/GeneralSans-Medium.otf" as="font" type="font/otf" crossorigin />
    <link rel="preload" href="/fonts/GeneralSans-Regular.otf" as="font" type="font/otf" crossorigin />
    <link rel="preload" href="/fonts/GeneralSans-Light.otf" as="font" type="font/otf" crossorigin />
    <!-- Preload landing page mono font (largest font, breaks dependency chain) -->
    <link rel="preload" href="/fonts/MonaspaceKrypton-Regular.otf" as="font" type="font/otf" crossorigin />
    <!-- Preload LCP hero image -->
    <link rel="preload" href="/krill/krill-welcome.svg" as="image" type="image/svg+xml" />

    <!-- Google Fonts: async load to avoid render-blocking -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" /></noscript>

    <!-- Security headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Content Security Policy -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
      default-src 'self';
      script-src 'self' https://hcaptcha.com https://*.hcaptcha.com;
      worker-src blob:;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://hcaptcha.com https://*.hcaptcha.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: blob: https: http:;
      media-src 'self' blob: https:;
      connect-src 'self' http://ipc.localhost https://foquucurnwpqcvgqukpz.supabase.co https://*.supabase.co https://*.functions.supabase.co wss://*.supabase.co https://api.kibun.social wss://api.kibun.social https://livekit.kibun.social wss://livekit.kibun.social https://api.giphy.com https://media.giphy.com https://media0.giphy.com https://media1.giphy.com https://media2.giphy.com https://media3.giphy.com https://media4.giphy.com https://hcaptcha.com https://*.hcaptcha.com https://sentry.hcaptcha.com;
      frame-src https://www.youtube.com https://player.vimeo.com https://store.steampowered.com https://open.spotify.com https://w.soundcloud.com https://player.twitch.tv https://clips.twitch.tv https://player.kick.com https://hcaptcha.com https://*.hcaptcha.com;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
    "
    />

    <!-- Default Open Graph (overridden per-page by react-helmet-async) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kloak" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Kloak - Private Communication Platform" />
    <meta
      property="og:description"
      content="Privacy-first communication platform. No email, no passwords, no tracking. Your conversations belong to you."
    />
    <meta property="og:url" content="https://kloak.app" />
    <meta property="og:image" content="http://kloak.app/favicon.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kloak - Private Communication Platform" />
    <meta
      name="twitter:description"
      content="Privacy-first communication platform. No email, no passwords, no tracking. Your conversations belong to you."
    />
    <meta name="twitter:image" content="http://kloak.app/favicon.png" />

    <!-- Theme initialization script - external file to allow strict CSP (no unsafe-inline) -->
    <script src="/theme-init.js"></script>

    <!-- Critical inline styles to prevent FOUC while CSS loads via JS -->
    <style>
      /* Critical @font-face so browser can start fetching fonts before JS-injected CSS arrives */
      @font-face { font-family: "General Sans"; src: url("/fonts/GeneralSans-Medium.otf") format("opentype"); font-weight: 500; font-style: normal; font-display: swap; }
      @font-face { font-family: "General Sans"; src: url("/fonts/GeneralSans-Regular.otf") format("opentype"); font-weight: 400; font-style: normal; font-display: swap; }
      @font-face { font-family: "General Sans"; src: url("/fonts/GeneralSans-Light.otf") format("opentype"); font-weight: 300; font-style: normal; font-display: swap; }
      @font-face { font-family: "Monaspace Krypton"; src: url("/fonts/MonaspaceKrypton-Regular.otf") format("opentype"); font-weight: 400; font-style: normal; font-display: swap; }
      :root { --background: 0 0% 4%; --foreground: 60 9% 85%; }
      body { margin: 0; background-color: hsl(0, 0%, 4%); color: hsl(60, 9%, 85%); font-family: "General Sans", system-ui, -apple-system, sans-serif; }
      #root { min-height: 100vh; }
    </style>
  </head>

  <body>
    <div id="root">
      <!-- Static shell for fast First Contentful Paint - replaced by React on mount -->
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;background:hsl(0,0%,4%)">
        <img src="/favicon.png" alt="Kloak" width="48" height="48" style="margin-bottom:16px" />
        <p style="color:hsl(60,9%,85%);font-family:system-ui,-apple-system,sans-serif;font-size:14px;opacity:0.6;margin:0">Loading Kloak…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
