app = "kloak-ws"
primary_region = "sin"

kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  KLOAK_WS_HOST = "0.0.0.0"
  KLOAK_WS_HEARTBEAT_MS = "30000"
  KLOAK_WS_REPLAY_EVENTS = "1000"
  KLOAK_WS_MAX_TOPICS_PER_SOCKET = "250"
  KLOAK_WS_MAX_MESSAGE_BYTES = "16384"
  KLOAK_WS_MAX_BUFFERED_BYTES = "1048576"
  KLOAK_WS_RATE_LIMIT_WINDOW_MS = "10000"
  KLOAK_WS_RATE_LIMIT_MESSAGES = "80"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"
